[project]
name = "openmm-cli"
version = "0.1.0"
description = "Command line interface for running OpenMM simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mdtraj>=1.11.1.post1",
    "numpy>=2.4.2",
    "openmm[cuda12]>=8.5",
    "pdbfixer>=1.12.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]
[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.0",
    "pandas>=2.0",
]
[project.scripts]
openmm-cli = "openmm_cli.cli:app"
[project.urls]
Documentation = "https://jankocivic.github.io/openmm-cli/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6",
    "mkdocs-typer2>=0.3.0",
    "mkdocstrings[python]>=1.0.4",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
